<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e0f1d">
<meta name="description" content="Kingdom Reborn: a gentle, game-like habit system for rebuilding your life and company.">
<title>Kingdom Reborn</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#0e0f1d;--bg2:#15162b;--card:#1c1d38;--card2:#25274c;--line:#33365e;
  --text:#efeadb;--muted:#a9a5c2;--dim:#6f6c8c;
  --gold:#f2c14e;--gold2:#ffe08f;--work:#6aa9ff;--body:#5fd38d;--heart:#ff8fab;--fun:#b18cff;--danger:#ff8a7a;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{background:radial-gradient(ellipse at 50% -10%,#2a2357 0%,var(--bg) 55%) fixed var(--bg);min-height:100vh}
h1,h2,h3,.serif{font-family:Georgia,"Times New Roman",serif;letter-spacing:.2px;margin:0}
h2{font-size:20px}h3{font-size:17px}
p{margin:.3em 0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{font:inherit;color:var(--text);background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%}
textarea{min-height:90px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:2px solid var(--gold);outline-offset:1px}
#app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:5;background:rgba(14,15,29,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;border-bottom:1px solid var(--line)}
.lvl{font-family:Georgia,serif;font-weight:700;color:var(--gold);white-space:nowrap;font-size:15px}
.lvl small{display:block;color:var(--muted);font-family:system-ui,sans-serif;font-weight:500;font-size:11px}
.bar{height:10px;background:var(--bg2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:99px;transition:width .5s}
.pill{background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:6px 10px;font-size:13px;white-space:nowrap}
main{padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card.glow{border-color:rgba(242,193,78,.55);box-shadow:0 0 0 1px rgba(242,193,78,.15),0 8px 30px -12px rgba(242,193,78,.35)}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}
.row{display:flex;gap:10px;align-items:center}.wrap{flex-wrap:wrap}.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 16px;border-radius:14px;background:var(--card2);border:1px solid var(--line);font-weight:600}
.btn:active{transform:scale(.97)}
.btn.gold{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#2a1d00;border-color:transparent}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.btn.sm{min-height:38px;padding:6px 12px;font-size:14px;border-radius:11px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:99px;background:var(--bg2);border:1px solid var(--line);font-size:14px}
.chip.on{background:rgba(242,193,78,.15);border-color:var(--gold);color:var(--gold2)}
.section-t{display:flex;align-items:center;justify-content:space-between;margin:20px 2px 10px}
.section-t h3{font-size:16px;color:var(--gold2)}
.voice{font-family:Georgia,serif;font-size:19px;line-height:1.35;margin:4px 2px 14px}
.energy{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.energy button{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px}
.energy button b{font-size:26px;line-height:1}
.energy button.on{border-color:var(--gold);background:rgba(242,193,78,.12)}
.moods{display:flex;justify-content:space-between;margin-top:8px}
.moods button{font-size:28px;padding:6px;border-radius:12px;opacity:.55}
.moods button.on{opacity:1;background:rgba(242,193,78,.14)}
.q{display:flex;gap:12px;align-items:center;padding:14px;border-radius:14px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c,var(--gold));margin-bottom:10px}
.q .ic{font-size:22px;width:28px;text-align:center;flex:none}
.q .bd{flex:1;min-width:0}
.q .t{font-weight:650}
.q .tn{font-size:13px;color:var(--muted);margin-top:2px}
.q .meta{font-size:12px;color:var(--dim);margin-top:4px}
.q.done{opacity:.55}.q.done .t{text-decoration:line-through}
.chk{flex:none;width:46px;height:46px;border-radius:50%;border:2px solid var(--c,var(--gold));display:grid;place-items:center;font-size:20px;color:var(--c,var(--gold))}
.q.done .chk{background:var(--c,var(--gold));color:#141414}
.swap{flex:none;width:34px;height:34px;border-radius:10px;color:var(--dim);font-size:16px}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom));z-index:6;width:min(488px,calc(100% - 32px));min-height:52px;border-radius:16px;background:linear-gradient(180deg,#3b2f72,#2a2257);border:1px solid #5b4bb0;font-weight:700;box-shadow:0 10px 30px -10px rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;gap:8px}
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:7;background:rgba(17,18,36,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:center}
.tabs>div{display:grid;grid-template-columns:repeat(6,1fr);width:100%;max-width:520px}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;color:var(--muted);border-radius:12px}
.tabs button b{font-size:22px;line-height:1.1;filter:grayscale(.6);opacity:.8}
.tabs button.on{color:var(--gold2)}.tabs button.on b{filter:none;opacity:1}
.modal{position:fixed;inset:0;z-index:20;background:rgba(5,5,15,.7);display:flex;align-items:flex-end;justify-content:center}
.modal.hidden{display:none}
.sheet{background:var(--bg2);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;width:100%;max-width:520px;max-height:92vh;overflow:auto;padding:20px 16px calc(20px + env(safe-area-inset-bottom));animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet .opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:14px;border-radius:14px;background:var(--card);border:1px solid var(--line);margin-bottom:10px}
.sheet .opt b{font-size:24px}
.sheet .opt span small{display:block;color:var(--muted);font-size:13px;font-weight:400}
.quote{font-family:Georgia,serif;font-size:21px;line-height:1.35;color:var(--gold2);padding:14px 4px;text-align:center}
#toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-20px);z-index:30;width:min(480px,calc(100% - 32px));background:#2b2558;border:1px solid var(--gold);border-radius:16px;padding:12px 14px;opacity:0;pointer-events:none;transition:.3s;box-shadow:0 12px 40px -10px rgba(0,0,0,.8)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
#toast .x{font-weight:800;color:var(--gold2)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:25;overflow:hidden}
#fx i{position:absolute;top:35%;left:50%;width:9px;height:9px;border-radius:2px;animation:pop 1.1s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes pop{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}
@media (prefers-reduced-motion:reduce){#fx{display:none}.sheet{animation:none}}
.ring{display:grid;place-items:center;margin:10px auto 6px;position:relative;width:240px;height:240px}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring .tm{font-family:Georgia,serif;font-size:52px;font-variant-numeric:tabular-nums}
.dur{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dur button{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center}
.dur button b{display:block;font-size:22px;font-family:Georgia,serif}
.dur button.on{border-color:var(--gold);background:rgba(242,193,78,.12)}
.bld{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bld>div{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center}
.bld b{display:block;font-size:34px;line-height:1.2}
.bld .nm{font-size:12px;font-weight:600}.bld .st{font-size:11px;color:var(--dim)}
.bld .ruin b{filter:grayscale(1) brightness(.5);opacity:.6}
.bld .ruin .nm{color:var(--dim)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-family:Georgia,serif;font-size:24px;color:var(--gold2)}
.stat span{font-size:12px;color:var(--muted)}
.heat{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.heat>div{display:grid;grid-template-rows:repeat(7,1fr);gap:4px}
.heat i{display:block;aspect-ratio:1;border-radius:4px;background:var(--bg2);border:1px solid var(--line)}
.ach{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.ach>div{display:flex;gap:10px;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px}
.ach b{font-size:24px}.ach .lk{opacity:.4}.ach .lk b{filter:grayscale(1)}
.ach div div{font-size:12px;line-height:1.3}.ach strong{font-size:13px;display:block}
.step{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.step:last-child{border-bottom:0}
.step .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;background:var(--bg2);border:1px solid var(--line);flex:none}
.step.ok .n{background:var(--gold);color:#2a1d00;border-color:var(--gold)}
.step.lock{color:var(--dim)}
.step.cur{color:var(--gold2);font-weight:650}
.stepper{display:grid;grid-template-columns:48px 1fr 48px;gap:8px;align-items:center}
.stepper input{text-align:center;font-size:20px;font-family:Georgia,serif}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0}
.sw{width:52px;height:30px;border-radius:99px;background:var(--bg2);border:1px solid var(--line);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:.2s}
.sw.on{background:rgba(95,211,141,.25);border-color:var(--body)}.sw.on::after{left:25px;background:var(--body)}
label.f{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.dots{display:flex;gap:6px;justify-content:center;margin:12px 0}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--gold)}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
a{color:var(--gold2)}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="lvl" id="hLvl">Lv 1<small>Wanderer</small></div>
    <div><div class="bar"><i id="hXp" style="width:0"></i></div><div class="tiny muted" id="hXpT" style="margin-top:3px">0 XP</div></div>
    <div class="pill" id="hFun">🎮 —</div>
  </header>
  <main id="view"></main>
</div>
<button class="fab" id="fab" data-a="escape">🛡️ About to escape? Tap here first</button>
<nav class="tabs"><div>
  <button data-a="tab" data-v="today"><b>☀️</b>Today</button>
  <button data-a="tab" data-v="focus"><b>⏳</b>Focus</button>
  <button data-a="tab" data-v="keeper"><b>🔮</b>Keeper</button>
  <button data-a="tab" data-v="kingdom"><b>🏰</b>Kingdom</button>
  <button data-a="tab" data-v="quests"><b>📜</b>Quests</button>
  <button data-a="tab" data-v="me"><b>🛡️</b>Me</button>
</div></nav>
<div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<div id="fx"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script src="app1.js"></script>
<script src="app2.js"></script>
<script src="app3.js"></script>
<script src="app4.js"></script>
<script src="keeper.js"></script>
<script src="boss1.js"></script>
<script src="boss2.js"></script>
<script src="boss3.js"></script>
<script src="juice.js"></script>
<script src="sync.js"></script>
<script src="voice.js"></script>
</body>
</html>
